name: Deploy – url-shortener

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git SHA or ref to deploy
        required: false
      udap_run_id:
        description: UDAP run id (injected by platform)
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Test
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: |
          python - <<'PYEOF'
          import sys
          from fastapi.testclient import TestClient
          from main import app
          client = TestClient(app, raise_server_exceptions=True)

          # Health check
          r = client.get("/health")
          assert r.status_code == 200, f"Health failed: {r.status_code}"

          # Shorten
          r = client.post("/shorten", json={"url": "https://example.com/foo"})
          assert r.status_code == 200, f"Shorten failed: {r.status_code}"
          code = r.json()["short_code"]

          # Redirect
          r = client.get(f"/{code}", follow_redirects=False)
          assert r.status_code == 302, f"Redirect failed: {r.status_code}"

          print("All smoke tests passed.")
          sys.exit(0)
          PYEOF

  # -------------------------------------------------------------------------
  # 2. Build & push image to ECR
  # -------------------------------------------------------------------------
  build:
    name: Build & push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_url: ${{ steps.ecr.outputs.ecr_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        id: ecr
        run: |
          REPO_URL=$(aws ecr describe-repositories \
            --repository-names "${{ vars.SERVICE_NAME }}" \
            --query 'repositories[0].repositoryUri' --output text 2>/dev/null) || true

          if [ -z "$REPO_URL" ] || [ "$REPO_URL" = "None" ]; then
            REPO_URL=$(aws ecr create-repository \
              --repository-name "${{ vars.SERVICE_NAME }}" \
              --query 'repository.repositoryUri' --output text)
          fi
          echo "ecr_url=$REPO_URL" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build & push
        run: |
          docker build -t ${{ steps.ecr.outputs.ecr_url }}:${{ steps.meta.outputs.tag }} \
                       -t ${{ steps.ecr.outputs.ecr_url }}:latest .
          docker push ${{ steps.ecr.outputs.ecr_url }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.ecr.outputs.ecr_url }}:latest

  # -------------------------------------------------------------------------
  # 3. Provision / update infrastructure with Terraform
  # -------------------------------------------------------------------------
  provision:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: build
    outputs:
      alb_dns: ${{ steps.tf_out.outputs.alb_dns }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve \
            -var="service_name=${{ vars.SERVICE_NAME }}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="image_tag=${{ needs.build.outputs.image_tag }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Capture ALB DNS
        id: tf_out
        working-directory: infra
        run: |
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

  # -------------------------------------------------------------------------
  # 4. Force ECS to pick up the new image
  # -------------------------------------------------------------------------
  deploy:
    name: ECS force-new-deployment
    runs-on: ubuntu-latest
    needs: [build, provision]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update ECS task definition image
        run: |
          # Register a new task definition revision pointing at the new tag
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ vars.SERVICE_NAME }} \
            --query 'taskDefinition' --output json)

          NEW_IMAGE="${{ needs.build.outputs.ecr_url }}:${{ needs.build.outputs.image_tag }}"

          NEW_TD=$(echo "$TASK_DEF" | python3 - <<PYEOF
          import json, sys
          td = json.load(sys.stdin)
          for cd in td["containerDefinitions"]:
              cd["image"] = "${NEW_IMAGE}"
          for k in ["taskDefinitionArn","revision","status","requiresAttributes",
                    "compatibilities","registeredAt","registeredBy"]:
              td.pop(k, None)
          print(json.dumps(td))
          PYEOF
          )

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TD" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster ${{ vars.SERVICE_NAME }} \
            --service  ${{ vars.SERVICE_NAME }} \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Wait for ECS service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.SERVICE_NAME }} \
            --services ${{ vars.SERVICE_NAME }}

  # -------------------------------------------------------------------------
  # 5. Verify the service answers
  # -------------------------------------------------------------------------
  verify:
    name: Verify live
    runs-on: ubuntu-latest
    needs: [provision, deploy]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Poll until healthy (5 min)
        run: |
          ALB_DNS="${{ needs.provision.outputs.alb_dns }}"
          URL="http://${ALB_DNS}/health"
          echo "Polling ${URL}"
          for i in $(seq 1 30); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "${URL}" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy."
              echo "Live URL: http://${ALB_DNS}"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: service did not become healthy in time."
          exit 1
